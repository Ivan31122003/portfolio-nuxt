workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - quality
  - build
  - deploy

default:
  image: node:24.19.0-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

.node_setup:
  before_script:
    - npm install -g npm@11.6.1
    - npm ci --cache .npm --prefer-offline

prettier:
  extends: .node_setup
  stage: quality
  script:
    - npm run format

eslint:
  extends: .node_setup
  stage: quality
  script:
    - npm run lint

generate:
  extends: .node_setup
  stage: build
  script:
    - npm run generate
  artifacts:
    paths:
      - .output/public
    expire_in: 1 hour

deploy:
  stage: deploy
  image: alpine:3.21
  interruptible: false
  needs:
    - generate
  environment:
    name: production
  before_script:
    - apk add --no-cache lftp
  script:
    - |
      lftp -e "
        set ftp:ssl-allow yes;
        set ssl:verify-certificate no;
        set ftp:passive-mode true;
        open -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST};
        mirror -R --delete --verbose .output/public ${FTP_REMOTE_DIR};
        bye
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
