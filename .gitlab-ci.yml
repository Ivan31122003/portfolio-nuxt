workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - quality

default:
  image: node:24.19.0-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

.node_setup:
  before_script:
    - npm install -g npm@11.6.1
    - npm ci --cache .npm --prefer-offline

prettier:
  extends: .node_setup
  stage: quality
  script:
    - npm run format

eslint:
  extends: .node_setup
  stage: quality
  script:
    - npm run lint
